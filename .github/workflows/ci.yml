name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PNPM_VERSION: "12"
  NODE_VERSION: "24"
  UV_VERSION: "0.12.20"
  PYTHON_VERSION: "3.12"

jobs:
  api:
    name: API — lint, types, tests, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      LOG_FORMAT: json
      LOG_LEVEL: WARNING
      DATABASE_URL: postgresql+asyncpg://fisikkati_app:fisikkati_app_dev@127.0.0.1:5432/fisikkati_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://fisikkati_migrator:fisikkati_migrator_dev@127.0.0.1:5432/fisikkati_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_WEB_URL: http://localhost:3000
      RUN_INTEGRATION: "1"
      AUTH_JWT_ACTIVE_KID: test-1
      AUTH_JWT_PRIVATE_KEY: Zmktc2lra2F0aS10ZXN0LWVkMjU1MTktc2VlZC0zMmI=
      AUTH_PASSWORD_PEPPER: test-pepper-pppppppppppppppppppppppp
      AUTH_CSRF_SECRET: test-csrf-cccccccccccccccccccccccc
      AUTH_HASH_SECRET: test-hash-hhhhhhhhhhhhhhhhhhhhhhhh
      EMAIL_FROM_ADDRESS: no-reply@fisikkati.app
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      LEGAL_TERMS_VERSION: 2026-10-01
      LEGAL_PRIVACY_VERSION: 2026-10-01
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL/PostGIS and Redis (same init scripts as local dev)
        working-directory: infra/compose
        run: docker compose up -d --wait postgres redis

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: import-linter (module boundaries)
        run: uv run lint-imports

      - name: Migrations — upgrade, drift check, downgrade, upgrade
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Tests (unit, API, integration)
        run: uv run pytest -q

      - name: OpenAPI drift check (committed client schema == generated)
        run: |
          uv run python scripts/export_openapi.py /tmp/openapi.json
          diff -u ../../packages/types/openapi.json /tmp/openapi.json

      - name: pip-audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements.txt > /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt

  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: No UTF-8 BOMs (breaks JSON/YAML parsers)
        run: |
          if git grep -Il $'^\xEF\xBB\xBF' -- . ':!*.png' ':!*.ico'; then
            echo "Files above start with a UTF-8 BOM"; exit 1
          fi

      - name: Prettier
        run: pnpm format

      - name: Generated API client is up to date
        run: |
          pnpm types:generate
          git diff --exit-code -- packages/types/src/schema.d.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm --filter @fi-sikkati/web test

      - name: Build
        run: pnpm --filter @fi-sikkati/web build

      - name: pnpm audit (high and above)
        run: pnpm audit --audit-level high

  e2e:
    name: E2E — Playwright smoke against API + web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, web]
    env:
      APP_ENV: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://fisikkati_app:fisikkati_app_dev@127.0.0.1:5432/fisikkati
      MIGRATION_DATABASE_URL: postgresql+asyncpg://fisikkati_migrator:fisikkati_migrator_dev@127.0.0.1:5432/fisikkati
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      WEB_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8000
      AUTH_JWT_ACTIVE_KID: test-1
      AUTH_JWT_PRIVATE_KEY: Zmktc2lra2F0aS10ZXN0LWVkMjU1MTktc2VlZC0zMmI=
      AUTH_PASSWORD_PEPPER: test-pepper-pppppppppppppppppppppppp
      AUTH_CSRF_SECRET: test-csrf-cccccccccccccccccccccccc
      AUTH_HASH_SECRET: test-hash-hhhhhhhhhhhhhhhhhhhhhhhh
      EMAIL_FROM_ADDRESS: no-reply@fisikkati.app
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      AUTH_REGISTER_RATE_LIMIT: 100/60
      AUTH_LOGIN_RATE_LIMIT_PER_IP: 100/60
      AUTH_LOGIN_RATE_LIMIT_PER_IDENTIFIER: 100/60
      AUTH_FORGOT_RATE_LIMIT_PER_IDENTIFIER: 100/60
      AUTH_FORGOT_RATE_LIMIT_PER_IP: 100/60
      AUTH_EMAIL_RESEND_RATE_LIMIT: 100/60
      ARGON2_TIME_COST: "1"
      ARGON2_MEMORY_COST_KIB: "8192"
      ARGON2_PARALLELISM: "1"
      LEGAL_TERMS_VERSION: 2026-10-01
      LEGAL_PRIVACY_VERSION: 2026-10-01
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL/PostGIS, Redis and Mailpit
        working-directory: infra/compose
        run: docker compose up -d --wait postgres redis mailpit

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: |
          (cd apps/api && uv sync --frozen)
          pnpm install --frozen-lockfile
          pnpm --filter @fi-sikkati/e2e install-browsers

      - name: Migrate and start API
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          nohup uv run uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health/ready && break || sleep 1; done

      - name: Build and start web
        run: |
          pnpm --filter @fi-sikkati/web build
          nohup pnpm --filter @fi-sikkati/web start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/ar && break || sleep 1; done

      - name: Playwright
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            /tmp/api.log
            /tmp/web.log
          retention-days: 7

  security:
    name: Security — secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker — images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
