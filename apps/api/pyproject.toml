[project]
name = "fi-sikkati-api"
version = "0.1.0"
description = "Fi Sikkati backend — community ride-sharing and route-matching platform API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "geoalchemy2>=0.15",
  "redis>=5.1",
  "arq>=0.26",
  "structlog>=24.4",
  "orjson>=3.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "asgi-lifespan>=2.1",
  "mypy>=1.11",
  "ruff>=0.6",
  "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff — lint + format (ADR-0003)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "B",           # bugbear
  "UP",          # pyupgrade
  "N",           # naming
  "S",           # bandit (security)
  "ASYNC",       # async pitfalls
  "C4",          # comprehensions
  "DTZ",         # naive datetimes
  "T20",         # print statements
  "SIM",         # simplify
  "RUF",         # ruff-specific
  "PL",          # pylint subset
  "TRY",         # exception handling
  "ERA",         # commented-out code
]
ignore = [
  "PLR0913",     # too many arguments — DI-heavy FastAPI code
  "TRY003",      # long messages in exceptions are fine for AppError
  "RUF012",      # mutable class attrs — pydantic/sqlalchemy models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG"]
"alembic/**" = ["E501", "ERA001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy — strict (ADR-0003)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "arq.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
  "integration: requires PostgreSQL/Redis (set DATABASE_URL/REDIS_URL)",
]

# ---------------------------------------------------------------------------
# import-linter — module boundaries (ADR-0001)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Core must not depend on domain modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.api", "app.workers"]

[[tool.importlinter.contracts]]
name = "Domain modules are independent (no cross-module imports except via services/events)"
type = "independence"
modules = ["app.modules.platform"]
