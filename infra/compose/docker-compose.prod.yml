# Production-shaped stack. Secrets come from the environment — never commit them.
# Caddy terminates TLS in front of web (3000) and proxies /api to the API (8000).

name: fi-sikkati-prod

x-api-env: &api-env
  APP_ENV: production
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  DATABASE_URL: ${DATABASE_URL}
  MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  CORS_ORIGINS: ${PUBLIC_WEB_URL}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
  AUTH_JWT_ACTIVE_KID: ${AUTH_JWT_ACTIVE_KID}
  AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY}
  AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER}
  AUTH_CSRF_SECRET: ${AUTH_CSRF_SECRET}
  AUTH_HASH_SECRET: ${AUTH_HASH_SECRET}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
  SMTP_HOST: ${SMTP_HOST}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:no-reply@fisikkati.app}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
  SMS_FROM: ${SMS_FROM}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  LEGAL_TERMS_VERSION: ${LEGAL_TERMS_VERSION}
  LEGAL_PRIVACY_VERSION: ${LEGAL_PRIVACY_VERSION}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-env
    depends_on:
      - worker
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "arq", "app.workers.main.WorkerSettings"]
    environment:
      <<: *api-env
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_WEB_URL}
      API_INTERNAL_URL: http://api:8000
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy-data:
